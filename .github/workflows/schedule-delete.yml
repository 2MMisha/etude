name: "Schedule: Delete Slot"

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Slot ID to delete (must match exactly, e.g. 'mon-latin-beginner')"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete schedule slot file
        env:
          SLOT_ID: ${{ inputs.id }}
        run: |
          if ! [[ "$SLOT_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Invalid id \"$SLOT_ID\" — use lowercase letters, numbers, and hyphens only."
            exit 1
          fi
          FILE="src/content/schedule/${SLOT_ID}.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::No schedule slot found at $FILE — check the ID and try again."
            exit 1
          fi
          rm "$FILE"

      - name: Commit and push
        env:
          SLOT_ID: ${{ inputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/schedule/
          git commit -m "Schedule: delete slot '${SLOT_ID}' via workflow"
          git push
