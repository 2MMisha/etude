name: "News: Delete Post"

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Post ID to delete (must match exactly, e.g. 'new-beginner-group')"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete news post file
        env:
          POST_ID: ${{ inputs.id }}
        run: |
          if ! [[ "$POST_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Invalid id \"$POST_ID\" — use lowercase letters, numbers, and hyphens only."
            exit 1
          fi
          FILE="src/content/news/${POST_ID}.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::No news post found at $FILE — check the ID and try again."
            exit 1
          fi
          rm "$FILE"

      - name: Commit and push
        env:
          POST_ID: ${{ inputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/news/
          git commit -m "News: delete post '${POST_ID}' via workflow"
          git push
