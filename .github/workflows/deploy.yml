name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild hourly so the schedule page and the studio /display/ screen pick
  # up edits to the Google Sheet timetable (see src/lib/loadTimetable.ts).
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      trainer-changes: ${{ steps.changes.outputs.messages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # What changed on each /trainers/ page against the live site (scripts/notify-trainers.mjs).
      - name: Trainer schedule changes
        id: changes
        continue-on-error: true
        run: node scripts/notify-trainers.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Push the changes to the trainers' app once the new pages are live.
  notify-trainers:
    needs: [build, deploy]
    if: needs.build.outputs.trainer-changes != '' && needs.build.outputs.trainer-changes != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/notify-trainers.mjs
        env:
          ONESIGNAL_TRAINERS_REST_API_KEY: ${{ secrets.ONESIGNAL_TRAINERS_REST_API_KEY }}
          MESSAGES: ${{ needs.build.outputs.trainer-changes }}
