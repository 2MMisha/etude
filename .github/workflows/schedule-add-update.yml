name: "Schedule: Add or Update Slot"

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Slot ID (lowercase-with-hyphens). Reuse an existing ID to update that slot."
        required: true
        type: string
      day:
        description: "Day of week"
        required: true
        type: choice
        options:
          - sunday
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
      start_time:
        description: "Start time (24h HH:MM, e.g. 18:00)"
        required: true
        type: string
      end_time:
        description: "End time (24h HH:MM, e.g. 19:00)"
        required: true
        type: string
      level:
        description: "Level"
        required: true
        type: choice
        options:
          - beginner
          - intermediate
          - advanced
          - private
      class_name_he:
        description: "Class name — Hebrew"
        required: true
        type: string
      class_name_en:
        description: "Class name — English"
        required: true
        type: string
      class_name_ru:
        description: "Class name — Russian"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write schedule slot
        env:
          INPUT_ID: ${{ inputs.id }}
          INPUT_DAY: ${{ inputs.day }}
          INPUT_START_TIME: ${{ inputs.start_time }}
          INPUT_END_TIME: ${{ inputs.end_time }}
          INPUT_LEVEL: ${{ inputs.level }}
          INPUT_CLASS_NAME_HE: ${{ inputs.class_name_he }}
          INPUT_CLASS_NAME_EN: ${{ inputs.class_name_en }}
          INPUT_CLASS_NAME_RU: ${{ inputs.class_name_ru }}
        run: node .github/scripts/update-schedule.mjs

      - name: Commit and push
        env:
          SLOT_ID: ${{ inputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/schedule/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Schedule: add/update slot '${SLOT_ID}' via workflow"
            git push
          fi
