<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Heebo:wght@400;500;600;700;800&family=Marck+Script&family=Gveret+Levin&display=block">
<style>
  :root {
    --navy: #17224a; --navy2: #1f2d5e; --blue: #2f4b9b; --blue5: #5570b8; --sky: #e6ebf7; --hi: #b9cbff;
    --sans: 'Montserrat', 'Heebo', sans-serif; --script: 'Marck Script', 'Gveret Levin', cursive;
  }
  :root[lang=he] { --sans: 'Heebo', sans-serif; --script: 'Gveret Levin', cursive; }
  html, body { margin: 0; background: var(--navy); }
  #stage { position: relative; overflow: hidden; background: var(--navy); color: #fff; font-family: var(--sans); }
  #stage * { box-sizing: border-box; }
  .abs { position: absolute; }
  .fill { position: absolute; inset: 0; }
  .cover { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scene { position: absolute; inset: 0; }
  .script { font-family: var(--script); font-weight: 400; line-height: 1.08; }
  .sans { font-family: var(--sans); }
  .w { display: inline-block; white-space: pre; }
  .shadow { text-shadow: 0 2px 30px rgba(8, 14, 38, .65), 0 1px 3px rgba(8, 14, 38, .5); }
  .eyebrow { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--hi); }
  :root[lang=he] .eyebrow { letter-spacing: .02em; }
  .chip { display: inline-flex; align-items: center; gap: .4em; padding: .32em .9em; border-radius: 999px; border: 2px solid rgba(255,255,255,.45); background: rgba(255,255,255,.07); font-weight: 600; white-space: nowrap; }
  .tile { display: inline-flex; align-items: center; justify-content: center; border-radius: 22%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.2); flex: none; }
  .tile svg, .ic svg { width: 58%; height: 58%; }
  .ic { display: inline-flex; align-items: center; justify-content: center; flex: none; }
  svg.line { fill: none; stroke: #d6e0fb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .card { border-radius: 26px; overflow: hidden; box-shadow: 0 30px 60px -25px rgba(0,0,0,.6); background: #0f1838; }
  .pill { display: inline-flex; align-items: center; gap: .45em; background: #fff; color: var(--navy); border-radius: 999px; padding: .28em .8em .28em .35em; font-weight: 800; box-shadow: 0 20px 50px -20px rgba(0,0,0,.6); }
  :root[lang=he] .pill { padding: .28em .35em .28em .8em; }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .row { display: flex; align-items: center; gap: .55em; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="ads.js"></script>
</body>
</html>
